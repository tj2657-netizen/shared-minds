	30% { transform: translateY(-8px) scale(1.22); filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12)); }

.hm-center-cat {

}

@keyframes cat-bounce {
  0%, 100% { transform: translateY(0); }

}

@keyframes cat-breathe {
  0%, 100% { transform: scale(1); }

}

@keyframes tail-wag {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(12deg); }

}

function applyStarterCategoryLimits(card) {
	if (!card || card.id !== 'starter') {
		return;
	}

	let assigned = 0;
	STARTER_ALLOCATIONS.forEach((rule, idx) => {
		const cat = card.cats.find((c) => c.nm === rule.name);
		if (!cat) {
			return;
		}

		if (idx === STARTER_ALLOCATIONS.length - 1) {
			cat.pct = Math.max(0, Math.round(100 - assigned));
			cat.lim = getCategoryBudget(card, cat.pct);
			return;
		}

		const allocation = Math.round(rule.pct * 100);
		cat.pct = allocation;
		cat.lim = getCategoryBudget(card, cat.pct);
		assigned += allocation;
	});
}

function escapeHTML(value) {
	return String(value)
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;')
		.replace(/'/g, '&#39;');
}

function renderCategoryName(name, accentColor) {
	const match = name.match(/^(.+?)\s*\((.+)\)$/);
	if (!match) {
		return `<div class="cn cn-single" style="color:${accentColor};">${escapeHTML(name)}</div>`;
	}

	const main = match[1].trim();
	const sub = match[2].trim();
	return `
		<div class="cn cn-stacked" style="color:${accentColor};">
			<div class="cn-main">${escapeHTML(main)}</div>
			<div class="cn-sub">(${escapeHTML(sub)})</div>
		</div>`;
}

		{ test: /(ads|ad\s*&\s*mktg|ads\s*&\s*marketing|marketing|marketi[ng]+)/, icon: '📣' },
		{ test: /(software|app|apps|computer|code|coding|tech|technology|program|programming)/, icon: '💻' },
		{ test: /(travel|trip|vacation|flight|airline|airplane|aero|plane)/, icon: '✈️' },
		{ test: /(hotel|hotels|lodging|stay|room|resort|inn)/, icon: '🏨' },
		{ test: /(lifestyle|entertain|hobby|fun|leisure|shopping|games|experience)/, icon: '🛍️' },
		{ test: /(transport|transit|uber|lyft|ride|commute|gas|fuel|car|vehicle)/, icon: '🚗' },
		{ test: /(treat|snack|food|coffee|dining|lunch|breakfast|grocery|grocer)/, icon: '🍽️' },

function launchConfettiAt(element, count = 28, themeColors = null) {
	if (!element) return;
	// play sparkling glitter sound for celebration
	try { playSparkleSound(); } catch (e) {}
	const rect = element.getBoundingClientRect();
	const cx = rect.left + rect.width / 2;
	const cy = rect.top + rect.height / 2;

	const canvas = document.createElement('canvas');
	canvas.className = 'confetti-canvas';
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;
	document.body.appendChild(canvas);

	const ctx = canvas.getContext('2d');
	const colors = Array.isArray(themeColors) && themeColors.length ? themeColors : ['#ff4b5c','#ffb86b','#ffd86b','#7be495','#5ad0f5','#9b88ff'];
	const pieces = [];

	for (let i=0;i<count;i++) {
		pieces.push({
			x: cx,
			y: cy,
			sx: (Math.random()-0.5)*10,
			sy: - (Math.random()*7+2),
			size: Math.random()*8+6,
			angle: Math.random()*360,
			color: colors[Math.floor(Math.random()*colors.length)],
			life: 0
		});
	}

	let frame = 0;
	function step() {
		ctx.clearRect(0,0,canvas.width,canvas.height);
		for (let p of pieces) {
			p.life += 1;
			p.x += p.sx;
			p.y += p.sy + p.life*0.12;
			p.angle += p.sx*2;
			ctx.save();
			ctx.translate(p.x,p.y);
			ctx.rotate(p.angle*Math.PI/180);
			ctx.fillStyle = p.color;
			ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
			ctx.restore();
		}
		frame++;
		if (frame < 120) requestAnimationFrame(step);
		else {
			if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
		}
	}
	requestAnimationFrame(step);
}

function playSparkleSound() {
	try {
		const ctx = new (window.AudioContext || window.webkitAudioContext)();
		const master = ctx.createGain();
		master.gain.value = 0.6;
		master.connect(ctx.destination);
		const now = ctx.currentTime;
		// create a quick shower of high, short tones
		for (let i = 0; i < 10; i++) {
			const o = ctx.createOscillator();
			const g = ctx.createGain();
			// lower base frequencies for a warmer sparkle
			const base = 500 + Math.random() * 800;
			const detune = (Math.random() - 0.5) * 60;
			o.type = Math.random() > 0.7 ? 'triangle' : 'sine';
			o.frequency.setValueAtTime(base, now + i * 0.03);
			o.detune.value = detune;
			// short, softer envelope
			g.gain.setValueAtTime(0.0001, now + i * 0.03);
			g.gain.exponentialRampToValueAtTime(0.06 + Math.random() * 0.06, now + i * 0.03 + 0.01);
			g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.03 + 0.22);
			o.connect(g); g.connect(master);
			o.start(now + i * 0.03);
			o.stop(now + i * 0.03 + 0.22 + Math.random() * 0.06);
		}
		// close context after playback
		setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1200);
	} catch (e) {
		// ignore audio errors
	}
}

function playBonkSound() {
	try {
		const ctx = new (window.AudioContext || window.webkitAudioContext)();
		const o = ctx.createOscillator();
		const g = ctx.createGain();
		o.type = 'sine';
		const now = ctx.currentTime;
		// start a low 'bonk' frequency sweep
		o.frequency.setValueAtTime(120, now);
		o.frequency.exponentialRampToValueAtTime(50, now + 0.18);
		g.gain.setValueAtTime(0.0001, now);
		g.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
		g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
		o.connect(g); g.connect(ctx.destination);
		o.start(now);
		o.stop(now + 0.25);
		// close context later to free resources
		setTimeout(() => { try { ctx.close(); } catch (e) {} }, 600);
	} catch (e) {
		// fallback: try to play a short beep via Audio element (not provided)
	}
}

function getCategoryLabel(cat) {

}

function formatMoney(value) {
	return `$${Math.round(Number(value) || 0).toLocaleString()}`;
}

function hexToRgb(hex) {
	const value = String(hex || '').trim().replace('#', '');
	if (!/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value)) {
		return null;
	}
	const full = value.length === 3 ? value.split('').map((part) => part + part).join('') : value;
	const intValue = Number.parseInt(full, 16);
	return {
		r: (intValue >> 16) & 255,
		g: (intValue >> 8) & 255,
		b: intValue & 255
	};
}

function rgbToHex(r, g, b) {
	return `#${[r, g, b].map((part) => Math.max(0, Math.min(255, Math.round(part))).toString(16).padStart(2, '0')).join('')}`;
}

function mixHexColors(baseHex, mixHex, ratio) {
	const base = hexToRgb(baseHex);
	const mix = hexToRgb(mixHex);
	if (!base || !mix) {
		return baseHex;
	}
	const t = Math.max(0, Math.min(1, Number(ratio) || 0));
	return rgbToHex(
		base.r + (mix.r - base.r) * t,
		base.g + (mix.g - base.g) * t,
		base.b + (mix.b - base.b) * t
	);
}

function getThemeConfettiColors(card) {
	const accent = card?.accent || '#5ad0f5';
	const track = card?.track || accent;
	const cycleBg = card?.cycleBg || '#ffffff';
	const catBg = card?.catBg || cycleBg;
	return [
		accent,
		track,
		mixHexColors(accent, '#ffffff', 0.28),
		mixHexColors(accent, '#000000', 0.18),
		mixHexColors(track, '#ffffff', 0.22),
		catBg,
		cycleBg
	];
}

function clampPercent(value) {
	return Math.max(0, Math.min(100, Number(value) || 0));
}

function getCategoryPercent(card, cat) {
	if (Number.isFinite(Number(cat.pct))) {
		return clampPercent(cat.pct);
	}
	if (Number.isFinite(Number(cat.lim)) && Number.isFinite(Number(card.limit)) && Number(card.limit) > 0) {
		return clampPercent((Number(cat.lim) / Number(card.limit)) * 100);
	}
	return 0;
}

function getCategoryBudget(card, pct) {
	return Math.max(0, Math.round((Number(card.limit) || 0) * clampPercent(pct) / 100));
}

const CATEGORY_LAYOUT_STORAGE_KEY = 'credit-journey-category-layout-v1';

function getCategoryCount(card) {
	return card.categoryCount || card.cats.length;
}

function createPlaceholderCategory(card, index) {
	const nextNumber = index + 1;
	return {
		nm: `Category ${nextNumber}`,
		ab: `C${nextNumber}`,
		spent: 0,
		lim: 0,
		pct: 0,
		extra: '1% back'
	};
}

function ensureCategorySlots(card, count) {
	while (card.cats.length < count) {
		card.cats.push(createPlaceholderCategory(card, card.cats.length));
	}
}

function persistCategoryLayout() {
	const payload = {};
	CARDS.forEach((card) => {
		payload[card.id] = {
			count: getCategoryCount(card),
			labels: card.cats.map((cat) => cat.label || ''),
			pcts: card.cats.map((cat) => getCategoryPercent(card, cat))
		};
	});
	try {
		localStorage.setItem(CATEGORY_LAYOUT_STORAGE_KEY, JSON.stringify(payload));
	} catch (error) {
		// Ignore storage failures.
	}
}

function loadCategoryLayout() {
	try {
		const raw = localStorage.getItem(CATEGORY_LAYOUT_STORAGE_KEY);
		if (!raw) {
			return;
		}

		const saved = JSON.parse(raw);
		CARDS.forEach((card) => {
			const layout = saved?.[card.id];
			if (!layout) {
				return;
			}

			const nextCount = Math.min(6, Math.max(3, Number(layout.count) || card.cats.length));
			ensureCategorySlots(card, nextCount);
			card.categoryCount = nextCount;
			if (Array.isArray(layout.labels)) {
				layout.labels.forEach((label, index) => {
					if (card.cats[index] && String(label).trim()) {
						card.cats[index].label = String(label).trim();
					}
				});
			}
			if (Array.isArray(layout.pcts)) {
				layout.pcts.forEach((pct, index) => {
					if (card.cats[index]) {
						card.cats[index].pct = clampPercent(pct);
					}
				});
			}
		});
	} catch (error) {
		// Ignore malformed storage data.
	}
}

loadCategoryLayout();

CARDS.forEach((card) => {
	ensureCategorySlots(card, MAX_CATEGORY_COUNT);
	if (card.id === 'starter') {
		STARTER_ALLOCATIONS.forEach((rule) => {
			const cat = card.cats.find((c) => c.nm === rule.name);
			if (cat && !Number.isFinite(Number(cat.pct))) {
				cat.pct = Math.round(rule.pct * 100);
			}
		});
	}
	card.cats.forEach((cat) => {
		if (!Number.isFinite(Number(cat.pct))) {
			cat.pct = getCategoryPercent(card, cat);
		}
		cat.lim = getCategoryBudget(card, cat.pct);
	});
});

const modifyPanel = document.getElementById('modifyPanel');
const modifyPanelCardLabel = document.getElementById('modifyPanelCardLabel');
const modifyPanelTitle = document.getElementById('modifyPanelTitle');
const modifyFields = document.getElementById('modifyFields');
const modifySummary = document.getElementById('modifySummary');
const modifyPanelSummary = modifyPanel ? modifyPanel.querySelector('summary') : null;
const modifyPanelSummaryNote = document.getElementById('modifyPanelSummaryNote');
const modifyPanelClose = document.getElementById('modifyPanelClose');
const modifyCancelBtn = document.getElementById('modifyCancelBtn');
const modifySaveBtn = document.getElementById('modifySaveBtn');

const modifyState = {
	cardId: CARDS[0]?.id || null,
	count: 5
};

function closeModifyPanel() {
	if (modifyPanel) {
		if (typeof modifyPanel.open !== 'undefined') modifyPanel.open = false;
	}
}

function updateModifyPreview() {
	const card = CARDS.find((c) => c.id === modifyState.cardId);
	if (!card || !modifySummary || !modifyFields) {
		return;
	}

	const rows = Array.from(modifyFields.querySelectorAll('[data-category-row]')).slice(0, modifyState.count);
	let totalPct = 0;
	let totalBudget = 0;

	rows.forEach((row) => {
		const pctInput = row.querySelector('[data-pct-input]');
		const preview = row.querySelector('[data-budget-preview]');
		const pct = clampPercent(pctInput?.value);
		const budget = getCategoryBudget(card, pct);
		totalPct += pct;
		totalBudget += budget;
		if (preview) {
			preview.textContent = `${pct}% = ${formatMoney(budget)}/mo`;
		}
	});

	const remainingPct = Math.max(0, 100 - totalPct);
	const remainingBudget = Math.max(0, (Number(card.limit) || 0) - totalBudget);
	const isTotalValid = Math.round(totalPct) === 100;
	modifySummary.className = `modify-summary ${totalPct > 100 ? 'modify-summary-warn' : ''}`.trim();
	modifySummary.innerHTML = `
		<div><strong>Total allocated:</strong> ${totalPct.toFixed(0)}% of 100% = ${formatMoney(totalBudget)}/mo</div>
		<div><strong>Remaining:</strong> ${remainingPct.toFixed(0)}% = ${formatMoney(remainingBudget)}/mo</div>
		<div class="modify-summary-note">Formula: monthly budget = credit limit × category percentage ÷ 100. The total must equal 100% before saving.</div>
	`;
	if (modifySaveBtn) {
		modifySaveBtn.disabled = !isTotalValid;
		modifySaveBtn.title = isTotalValid ? 'Save changes' : 'Category percentages must total 100%';
	}
}

function clampModifyCategoryPercent(input) {
	const card = CARDS.find((c) => c.id === modifyState.cardId);
	if (!card || !input || !modifyFields) {
		return;
	}

	const rows = Array.from(modifyFields.querySelectorAll('[data-category-row]')).slice(0, modifyState.count);
	const currentRow = input.closest('[data-category-row]');
	const otherTotal = rows.reduce((sum, row) => {
		if (row === currentRow) {
			return sum;
		}
		const pctInput = row.querySelector('[data-pct-input]');
		return sum + clampPercent(pctInput?.value);
	}, 0);
	const allowed = Math.max(0, 100 - otherTotal);
	const nextValue = Math.min(clampPercent(input.value), allowed);
	input.value = String(nextValue);
	updateModifyPreview();
}

function setModifyCategoryCount(nextCount) {
	const card = CARDS.find((c) => c.id === modifyState.cardId);
	if (!card) {
		return;
	}

	const clampedCount = Math.min(MAX_CATEGORY_COUNT, Math.max(MIN_CATEGORY_COUNT, Number(nextCount) || MIN_CATEGORY_COUNT));
	if (clampedCount < card.cats.length) {
		card.cats = card.cats.slice(0, clampedCount);
	}
	modifyState.count = clampedCount;
	openModifyPanel(card.id);
}

function normalizeCategoryOrder(card) {
	if (!card || !Array.isArray(card.cats)) {
		return;
	}

	card.cats.forEach((cat, index) => {
		cat.ab = `C${index + 1}`;
	});
}

function addModifyCategory(index) {
	const card = CARDS.find((c) => c.id === modifyState.cardId);
	if (!card || modifyState.count >= MAX_CATEGORY_COUNT) {
		return;
	}

	if (index < 0 || index >= modifyState.count) {
		return;
	}

	const insertAt = Math.min(index + 1, card.cats.length);
	card.cats.splice(insertAt, 0, createPlaceholderCategory(card, insertAt));
	card.categoryCount = Math.min(MAX_CATEGORY_COUNT, modifyState.count + 1);
	normalizeCategoryOrder(card);
	modifyState.count = card.categoryCount;
	openModifyPanel(card.id);
}

function removeModifyCategory(index) {
	const card = CARDS.find((c) => c.id === modifyState.cardId);
	if (!card || modifyState.count <= MIN_CATEGORY_COUNT) {
		return;
	}

	if (index < 0 || index >= modifyState.count) {
		return;
	}

	card.cats.splice(index, 1);
	card.categoryCount = Math.max(MIN_CATEGORY_COUNT, modifyState.count - 1);
	normalizeCategoryOrder(card);
	modifyState.count = card.categoryCount;
	openModifyPanel(card.id);
}

function openModifyPanel(cardId) {
	const card = CARDS.find((c) => c.id === cardId);
	if (!card || !modifyPanel || !modifyPanelCardLabel || !modifyPanelTitle || !modifyFields || !modifySummary) {
		return;
	}

	modifyState.cardId = card.id;
	modifyState.count = Math.min(MAX_CATEGORY_COUNT, Math.max(MIN_CATEGORY_COUNT, getCategoryCount(card)));
	if (typeof modifyPanel.open !== 'undefined') modifyPanel.open = true;
	if (modifyPanelSummaryNote) {
		modifyPanelSummaryNote.textContent = `${card.name} card`;
	}
	modifyPanelCardLabel.textContent = card.full;
	modifyPanelTitle.textContent = `Set ${card.name} categories, labels, and percentage limits`;
	if (modifySaveBtn) {
		modifySaveBtn.style.background = card.accent;
		modifySaveBtn.style.color = '#fff';
	}

	ensureCategorySlots(card, modifyState.count);
	modifyFields.innerHTML = card.cats.slice(0, modifyState.count).map((cat, index) => {
		const isVisible = index < modifyState.count;
		const canRemove = modifyState.count > MIN_CATEGORY_COUNT;
		const canAdd = modifyState.count < MAX_CATEGORY_COUNT;
		const pctValue = getCategoryPercent(card, cat);
		const budgetValue = getCategoryBudget(card, pctValue);
		return `
			<div class="modify-field" data-category-row style="display:${isVisible ? 'grid' : 'none'};">
				<div class="modify-field-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
					<label for="modify-${card.id}-${index}">Category ${index + 1}</label>
					<div style="display:flex;gap:6px;align-items:center;">
						<button class="tb modify-add" type="button" data-add-category data-index="${index}" ${canAdd ? '' : 'disabled'}>+</button>
						<button class="tb modify-delete" type="button" data-remove-category data-index="${index}" ${canRemove ? '' : 'disabled'}>-</button>
					</div>
				</div>
				<div class="modify-field-grid">
					<input class="gi" id="modify-${card.id}-${index}" type="text" value="${escapeHTML(getCategoryLabel(cat))}" placeholder="Category name" />
					<div style="display:flex;align-items:center;gap:6px;">
						<input class="gi" data-pct-input id="modify-pct-${card.id}-${index}" type="number" min="0" max="100" step="1" inputmode="numeric" value="${pctValue}" placeholder="% of limit" />
						<span class="pct-suffix" aria-hidden="true" style="font-weight:600;color:var(--color-text-secondary);">%</span>
					</div>
				</div>
				<div class="modify-budget-preview" data-budget-preview>${pctValue}% = ${formatMoney(budgetValue)}/mo</div>
			</div>
		`;
	}).join('');
	modifyFields.querySelectorAll('[data-pct-input]').forEach((input) => {
		input.addEventListener('input', () => clampModifyCategoryPercent(input));
	});
	modifyFields.querySelectorAll('[data-remove-category]').forEach((button) => {
		button.addEventListener('click', () => {
			removeModifyCategory(Number(button.dataset.index));
		});
	});
	modifyFields.querySelectorAll('[data-add-category]').forEach((button) => {
		button.addEventListener('click', () => {
			addModifyCategory(Number(button.dataset.index));
		});
	});
	updateModifyPreview();
}

function saveModifyPanel() {
	const card = CARDS.find((c) => c.id === modifyState.cardId);
	if (!card || !modifyFields) {
		return;
	}

	const totalPct = Array.from(modifyFields.querySelectorAll('[data-category-row]'))
		.slice(0, modifyState.count)
		.reduce((sum, row) => {
			const pctInput = row.querySelector('[data-pct-input]');
			return sum + clampPercent(pctInput?.value);
		}, 0);

	if (Math.round(totalPct) !== 100) {
		updateModifyPreview();
		return;
	}

	ensureCategorySlots(card, MAX_CATEGORY_COUNT);
	card.categoryCount = modifyState.count;
	for (let index = 0; index < modifyState.count; index += 1) {
		const input = document.getElementById(`modify-${card.id}-${index}`);
		const pctInput = document.getElementById(`modify-pct-${card.id}-${index}`);
		const nextLabel = String(input?.value ?? '').trim();
		const nextPct = clampPercent(pctInput?.value);
		if (nextLabel) {
			card.cats[index].label = nextLabel;
		}
		card.cats[index].pct = nextPct;
	}
	card.cats.slice(modifyState.count).forEach((cat) => {
		cat.pct = 0;
		cat.lim = 0;
	});
	syncCategoryBudgets(card);

	persistCategoryLayout();
	renderPanels();
	show(activeTabIndex);
	const saveCard = CARDS.find((c) => c.id === modifyState.cardId);
	if (modifySaveBtn && saveCard) {
		launchConfettiAt(modifySaveBtn, 30, getThemeConfettiColors(saveCard));
	}
	closeModifyPanel();
}

function ensureTravelInsights(card) {
	if (!card || card.id !== 'travel') {
		return;
	}

	if (!card.travelInsights) {
		card.travelInsights = {
			transactions: [
				{ merchant: 'Delta Airlines', amount: 420 },
				{ merchant: 'Hertz Rental Car', amount: 220 },
				{ merchant: 'Whole Foods', amount: 68 }

			bookingAmount: 650
		};
	}
}

function looksLikeTravelMerchant(name) {
	const value = String(name || '').toLowerCase();
	return TRAVEL_KEYWORDS.some((keyword) => value.includes(keyword));
}

function getWeightedCategoryUsagePercent(card) {
	const visibleCats = card?.cats?.slice(0, getCategoryCount(card)) || [];
	if (visibleCats.length === 0) {
		return 0;
	}

	const totals = visibleCats.reduce((sum, cat) => {
		const spent = Number(cat?.spent) || 0;
		const lim = Number(cat?.lim) || 0;
		sum.spent += spent;
		sum.limit += Math.max(0, lim);
		return sum;
	}, { spent: 0, limit: 0 });

	if (totals.limit <= 0) {
		return 0;
	}

	return (totals.spent / totals.limit) * 100;
}

function renderStarterStreakBar(c, cc, cpct) {
	const weightedPct = Math.round(getWeightedCategoryUsagePercent(c));
	const categoryOverLimit = c.cats.some((cat) => Number(cat.spent) > Number(cat.lim));
	const cardOverLimit = Number(c.used) > Number(c.limit);
	const streakBroken = categoryOverLimit || cardOverLimit;
	const overLimit = cardOverLimit || categoryOverLimit;
	const safePct = streakBroken ? 0 : Math.max(0, Math.min(100, weightedPct));
	const goalText = streakBroken ? (overLimit ? 'Streak broken - over limit' : 'Streak broken') : 'Streak active';
	const chipLabel = streakBroken ? '💔 Credit Streak' : '🔥 Credit Streak';

	return `<div class="streak-sn">
		<div class="streak-billing">
			<div>
				<div class="sl" style="color:#9a5a2c;margin-bottom:4px;">Billing cycle</div>
				<div class="cd" style="color:${cc};">${c.daysLeft} days left</div>
				<div class="streak-renew">until renewal</div>
			</div>
			<div class="streak-cycle">
				<div class="streak-cycle-label">Weighted category use</div>
				<div class="streak-cycle-value">${weightedPct}%</div>
			</div>
		</div>
		<div class="streak-note"><strong>Pay on time. Keep usage under 30%.</strong></div>
		<div class="streak-head">
			<div class="streak-chip ${streakBroken ? 'broken' : ''}" data-card="${c.id}" style="--glow:0;">
				<span class="streak-fire" data-fire="${c.id}">🔥</span>
				<span class="streak-label">${chipLabel}</span>
			</div>
			<div class="streak-goal ${streakBroken ? 'broken' : ''}">${goalText}</div>
		</div>
		<div class="streak-track"><div class="streak-fill ${streakBroken ? 'broken' : ''}" style="width:${safePct}%;"></div></div>
	</div>`;
}

		const categoryActions = `<div class="grocery-inline">

					<button class="gb${cp > 70 && !isStarterNearLimit ? ' warning' : ''}" onclick="logCategorySpend('${c.id}', '${cat.nm}', '${inputId}')" style="background:${isStarterNearLimit ? c.accent : cp > 70 ? '#FFD54A' : c.accent}; color:${cp > 70 && !isStarterNearLimit ? '#2b2b00' : '#fff'}">Add</button>
				</div>
				<div class="gp" style="color:${c.tS};">${rewardLabel}: <strong style="color:${c.tP};">${categoryPoints}</strong></div>
			</div>`;

		return `<div class="ck" data-cat="${cat.ab}" ${cp > 70 ? 'data-near-limit' : ''} style="background:${bgColor};border:0.5px solid ${c.brd};">
			<div class="ci">

				}
			</div>
			<div class="cat-icon">${categoryIcon}</div>
			${renderCategoryName(labelValue, c.tS)}

			<div class="cpct" style="color:${c.tT};">${cp}% of budget used</div>

	const sectionAfterCycle = `<div class="cg">${cats}</div>`;

function getAllowedLimits(card) {
	if (Array.isArray(card?.allowedLimits) && card.allowedLimits.length > 0) {
		return [...new Set(card.allowedLimits.map((limit) => Math.round(Number(limit) || 0)).filter((limit) => limit > 0))].sort((a, b) => a - b);
	}

	return [500, 800, 1000, 1500, 2000];
}

function normalizeAllowedLimit(card, value) {
	const allowedLimits = getAllowedLimits(card);
	const numericValue = Math.round(Number(value) || 0);
	if (allowedLimits.includes(numericValue)) {
		return numericValue;
	}

	let closest = allowedLimits[0];
	let closestDistance = Math.abs(closest - numericValue);
	for (const limit of allowedLimits) {
		const distance = Math.abs(limit - numericValue);
		if (distance < closestDistance) {
			closest = limit;
			closestDistance = distance;
		}
	}
	return closest;
}

function moveCreditStreakFire(cardId) {
	const fire = document.querySelector(`.streak-fire[data-fire="${cardId}"]`);
	if (!fire) {
		return;
	}
	fire.classList.remove('move');
	void fire.offsetWidth;
	fire.classList.add('move');
	window.setTimeout(() => fire.classList.remove('move'), 600);
}

function getRewardMultiplier(extraLabel) {
	const match = extraLabel.match(/([\d.]+)%/);
	if (!match) {
		return 1;
	}
	return Math.max(1, Math.round(Number(match[1])));
}

function logCategorySpend(cardId, categoryName, inputId) {
	const card = CARDS.find((c) => c.id === cardId);
	if (!card) {
		return;
	}

	const category = card.cats.find((cat) => cat.nm === categoryName);
	if (!category) {
		return;
	}

	const amountInput = document.getElementById(inputId);
	const enteredAmount = Number(amountInput?.value);
	if (!Number.isFinite(enteredAmount) || enteredAmount <= 0) {
		if (amountInput) {
			amountInput.focus();
		}
		return;
	}

	category.spent += enteredAmount;
	card.used += enteredAmount;
	if (!card.loopPointsMap) {
		card.loopPointsMap = {};
	}
	card.loopPointsMap[categoryName] = (card.loopPointsMap[categoryName] || 0) + enteredAmount * getRewardMultiplier(category.extra);
	moveCreditStreakFire(cardId);

	renderPanels();
	show(activeTabIndex);

	// visual feedback: popup, confetti or bonk+shake on limits
	try {
		const catAb = category.ab;
		const panel = document.querySelector(`.pnl-${cardId}`);
		const target = panel && panel.querySelector(`.ck[data-cat="${category.ab}"]`);
		// always pop the icon and show amount
		showCatPopup(cardId, catAb, `+ $${enteredAmount.toFixed(2)}`);
		animateCatIcon(cardId, catAb);

		const categoryExceeded = Number(category.spent) >= Number(category.lim);
		const cardExceeded = Number(card.used) >= Number(card.limit);

		if (categoryExceeded || cardExceeded) {
			// user reached/exceeded a limit — play bonk and shake the card
			playBonkSound();
			if (target) animateShake(cardId, catAb);
			const msg = categoryExceeded && cardExceeded
				? 'Category & card limit reached'
				: categoryExceeded
					? 'Category limit reached'
					: 'Card limit reached';
			showCatPopup(cardId, catAb, msg);
		} else {
			// celebratory confetti when under limits
			if (target) launchConfettiAt(target);
		}
	} catch (e) {
		// ignore visual errors
	}
}

function addTravelTransaction(cardId, merchantInputId, amountInputId) {
	const card = CARDS.find((c) => c.id === cardId);
	if (!card || card.id !== 'travel') {
		return;
	}

	ensureTravelInsights(card);
	const merchantInput = document.getElementById(merchantInputId);
	const amountInput = document.getElementById(amountInputId);
	const merchant = String(merchantInput?.value ?? '').trim();
	const amount = Number(amountInput?.value ?? 0);
	if (!merchant || !Number.isFinite(amount) || amount < 0) {
		return;
	}

	card.travelInsights.transactions.unshift({ merchant, amount });
	card.travelInsights.transactions = card.travelInsights.transactions.slice(0, 8);
	if (merchantInput) merchantInput.value = '';
	if (amountInput) amountInput.value = '';
	renderPanels();
	show(activeTabIndex);
}

function updateTravelBooking(cardId, inputId) {
	const card = CARDS.find((c) => c.id === cardId);
	if (!card || card.id !== 'travel') {
		return;
	}

	ensureTravelInsights(card);
	const input = document.getElementById(inputId);
	const value = Number(input?.value ?? 0);
	if (!Number.isFinite(value) || value < 0) {
		return;
	}
	card.travelInsights.bookingAmount = value;
	renderPanels();
	show(activeTabIndex);
}

function updateCreditLimit(cardId, inputId, buttonEl) {
	const card = CARDS.find((c) => c.id === cardId);
	if (!card) {
		return;
	}

	const limitInput = document.getElementById(inputId);
	const rawValue = String(limitInput?.value ?? '').replace(/[$,\s]/g, '');
	const enteredLimit = Number(rawValue);
	if (!Number.isFinite(enteredLimit) || enteredLimit <= 0) {
		if (limitInput) {
			limitInput.focus();
		}
		return;
	}

	card.limit = Math.round(enteredLimit);
	syncCategoryBudgets(card);
	launchConfettiAt(buttonEl, 24, getThemeConfettiColors(card));
	renderPanels();
	if (limitDropdown) {
		limitDropdown.open = false;
	}
	show(activeTabIndex);
}

function setLimitPreset(cardId, limit) {
	const card = CARDS.find((c) => c.id === cardId);
	if (!card) {
		return;
	}

	card.limit = normalizeAllowedLimit(card, limit);
	syncCategoryBudgets(card);
	renderPanels();
	show(activeTabIndex);
}

async function getIns(id) {
	const c = CARDS.find((x) => x.id === id);
	const btn = document.getElementById(`ib-${id}`);
	const out = document.getElementById(`io-${id}`);
	btn.disabled = true;
	out.innerHTML = `<div class="lm" style="color:${c.tS};">Analyzing your ${c.name.toLowerCase()} card profile...</div>`;

	const prompt = `You are a concise credit advisor. The user has a ${c.full}. Context: ${c.ctx}. Give exactly 3 short, specific, actionable tips tailored to THIS card type that many users overlook. Return only a JSON array: [{"title":"...","tip":"..."}]. No markdown, no preamble, no extra text.`;

	try {
		const r = await fetch('https://api.anthropic.com/v1/messages', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				model: 'claude-sonnet-4-20250514',
				max_tokens: 500,
				messages: [{ role: 'user', content: prompt }]
			})
		});
		const d = await r.json();
		const txt = (d.content || []).find((b) => b.type === 'text')?.text || '[]';
		const tips = JSON.parse(txt.replace(/```json|```/g, '').trim());
		out.innerHTML = tips.map((t) => `
			<div class="ik" style="background:${c.cycleBg};">
				<div class="it" style="color:${c.tP};">${t.title}</div>
				<div class="iy" style="color:${c.tS};">${t.tip}</div>
			</div>`).join('');
	} catch (e) {
		out.innerHTML = `<div class="lm" style="color:${c.tS};">Could not load insights - please try again.</div>`;
	}
	btn.disabled = false;
}

// Streak tracker: intensify glow while under 30%, cool down on break
window._streakState = window._streakState || {};
function _updateStreaksTick() {
	if (typeof CARDS === 'undefined') return;
	CARDS.forEach((c) => {
		const pct = Math.round(c.used / c.limit * 100);
		const id = c.id;
		const now = Date.now();
		const state = window._streakState[id] || { ms: 0, last: now };
		const low = pct < 30;
		if (low) {
			state.ms += Math.max(0, now - (state.last || now));
		} else {
			// cool down: reduce ms gradually to zero for smooth transition
			state.ms = Math.max(0, state.ms - 1000);
		}
		state.last = now;
		window._streakState[id] = state;

		const chip = document.querySelector(`.streak-chip[data-card="${id}"]`);
		if (!chip) return;

		if (!low && state.ms <= 0) {
			chip.classList.add('broken');
			chip.style.setProperty('--glow', 0);
			chip.textContent = '💔 Credit Streak';
		} else {
			chip.classList.remove('broken');
			chip.textContent = '🔥 Credit Streak';
			// map ms to glow intensity over demo duration (cap)
			// Demo default: 5 minutes -> change for production to 7*24*60*60*1000 (7 days)
			const DEMO_MS = 5 * 60 * 1000; // 5 minutes
			const maxMs = DEMO_MS;
			const glow = Math.min(1, state.ms / maxMs);
			chip.style.setProperty('--glow', String(+glow.toFixed(3)));
		}
	});
}
setInterval(_updateStreaksTick, 1000);
_updateStreaksTick();

show(0);
