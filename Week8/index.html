<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Underwater Cave Aquarium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hidden webcam for face detection -->
  <video
    id="faceVideo"
    playsinline
    muted
    autoplay
    width="640"
    height="480"
    style="position: absolute; left: -9999px; top: -9999px; width: 640px; height: 480px; opacity: 0; pointer-events: none;"
  ></video>
  
  <div id="canvas-container"></div>
  
  <div class="ui-panel">
    <h1>Underwater Cave Aquarium</h1>
    <div class="emotion-status">
      <p id="emotionDisplay">😊 Emotion: Detecting...</p>
      <p id="confidenceDisplay">Confidence: --</p>
      <p id="cameraHint" class="camera-hint">Click "Enable Camera" if permission is blocked.</p>
    </div>
    <div class="controls">
      <button id="enableCamera" class="btn">Enable Camera</button>
      <button id="toggleAutoRotate" class="btn">Toggle Auto Rotate</button>
      <button id="toggleLighting" class="btn">Toggle Lighting</button>
      <button id="spawnFish" class="btn">Spawn Fish</button>
      <button id="resetScene" class="btn">Reset Scene</button>
    </div>
    <div class="info">
      <p>😊 Smile = +Fish | 😢 Sad = -Fish</p>
      <p>🖱️ Drag to rotate | 🔍 Scroll to zoom | 🎮 Camera auto-rotates</p>
      <p id="stats">Fish: 0 | FPS: 60</p>
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- ml5.js pinned to faceApi-compatible version -->
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
